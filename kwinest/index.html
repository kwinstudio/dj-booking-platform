/* Interaction layer */
.kz-progress{
  position:fixed;left:0;top:0;height:3px;width:0;z-index:200;
  background:#08A9C5;transition:width .08s linear;pointer-events:none
}
.kz-reveal{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.kz-reveal.in-view{opacity:1;transform:none}

.kz-workflow{background:#F7FAF8;border-top:1px solid #E5ECE8;border-bottom:1px solid #E5ECE8;padding:84px 0}
.kz-workflow-inner{max-width:1200px;margin:auto;padding:0 22px}
.kz-workflow-grid{display:grid;grid-template-columns:.78fr 1.22fr;gap:32px;align-items:stretch}
.kz-workflow-tabs{display:grid;gap:8px}
.kz-workflow-tab{
  width:100%;text-align:left;background:#fff;border:1px solid #E1E8E5;border-radius:14px;
  padding:16px 17px;cursor:pointer;color:#20292E
}
.kz-workflow-tab strong{display:block;font-size:13px}
.kz-workflow-tab span{display:block;margin-top:4px;color:#65747A;font-size:10px;line-height:1.5}
.kz-workflow-tab.active{background:#20292E;color:#fff;border-color:#20292E;box-shadow:0 10px 25px rgba(32,41,46,.1)}
.kz-workflow-tab.active span{color:#C8D0D3}
.kz-workflow-stage{
  background:#fff;border:1px solid #E1E8E5;border-radius:20px;min-height:390px;padding:30px;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative
}
.kz-workflow-stage:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-80px;background:#F1F8EE}
.kz-workflow-meta{position:relative;z-index:1}
.kz-workflow-meta small{color:#078DA7;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.09em}
.kz-workflow-meta h3{font-size:34px;line-height:1.05;letter-spacing:-.05em;margin:10px 0 10px}
.kz-workflow-meta p{max-width:600px;color:#526169;font-size:12px;line-height:1.7}
.kz-workflow-preview{position:relative;z-index:1;margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kz-workflow-box{border:1px solid #E1E8E5;background:#F8FAF9;border-radius:12px;padding:13px}
.kz-workflow-box span{display:block;color:#819096;font-size:7px;text-transform:uppercase}
.kz-workflow-box b{display:block;margin-top:7px;font-size:10px;color:#20292E}

.kz-compare{max-width:1200px;margin:auto;padding:84px 22px}
.kz-compare-switch{display:inline-flex;background:#F1F5F3;border:1px solid #E1E8E5;border-radius:12px;padding:4px;gap:4px;margin-bottom:24px}
.kz-compare-switch button{border:0;background:transparent;border-radius:9px;padding:10px 14px;font-size:11px;font-weight:850;cursor:pointer;color:#526169}
.kz-compare-switch button.active{background:#20292E;color:#fff}
.kz-compare-panel{display:grid;grid-template-columns:.8fr 1.2fr;gap:24px;align-items:stretch}
.kz-compare-copy{border:1px solid #E1E8E5;background:#fff;border-radius:18px;padding:26px}
.kz-compare-copy h3{font-size:28px;letter-spacing:-.045em;margin:0 0 10px}
.kz-compare-copy p{font-size:12px;line-height:1.7;color:#526169}
.kz-compare-list{display:grid;gap:8px;margin-top:18px}
.kz-compare-item{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#F8FAF9;border-radius:11px;font-size:11px;color:#425159}
.kz-compare-item:before{content:"•";font-weight:900;color:#08A9C5}
.kz-compare-visual{border-radius:20px;background:#F3F8F5;border:1px solid #E2EAE6;padding:28px;display:grid;align-content:center}
.kz-compare-flow{display:grid;gap:10px}
.kz-compare-flow-row{display:grid;grid-template-columns:40px 1fr auto;gap:11px;align-items:center;background:#fff;border:1px solid #E1E8E5;border-radius:13px;padding:13px}
.kz-compare-flow-row i{width:40px;height:40px;border-radius:10px;background:#EAF7F9}

  margin-top:14px;border:0;background:transparent;padding:0;color:#078DA7;font-size:10px;font-weight:850;cursor:pointer
}

/* Document processing experience */
.processing-experience{--pe-accent:var(--primary);display:grid;gap:18px;min-width:0}
.processing-shell{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:22px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#fff,rgba(247,250,249,.92))}
.processing-document{position:relative;overflow:hidden;min-height:210px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:20px 16px;box-shadow:0 12px 30px rgba(21,38,35,.07)}
.processing-doc-mark{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.processing-doc-line{height:8px;border-radius:999px;background:#e9efed;margin:9px 0}
.processing-doc-line.short{width:58%}.processing-doc-line.medium{width:78%}
.processing-doc-total{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-weight:800}
.processing-scanline{position:absolute;left:10px;right:10px;top:20px;height:2px;background:var(--pe-accent);opacity:.42;box-shadow:0 0 12px rgba(33,94,79,.18);animation:documentScan 2.8s ease-in-out infinite}
.processing-copy{min-width:0}
.processing-eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.processing-title{font-size:22px;line-height:1.2;margin:0;color:var(--text)}
.processing-file{margin-top:7px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.processing-status{margin-top:16px;font-size:15px;font-weight:750;color:var(--text)}
.processing-subtext{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45;min-height:38px}
.processing-progress{margin-top:15px}
.processing-progress progress,.processing-overall progress{display:block;width:100%;height:7px;appearance:none;border:0;border-radius:999px;overflow:hidden;background:#e8eeec}
.processing-progress progress::-webkit-progress-bar,.processing-overall progress::-webkit-progress-bar{background:#e8eeec;border-radius:999px}
.processing-progress progress::-webkit-progress-value,.processing-overall progress::-webkit-progress-value{background:var(--pe-accent);border-radius:999px}
.processing-progress progress::-moz-progress-bar,.processing-overall progress::-moz-progress-bar{background:var(--pe-accent);border-radius:999px}
.processing-indeterminate{height:7px;border-radius:999px;background:#e8eeec;overflow:hidden;position:relative}
.processing-indeterminate::after{content:"";position:absolute;inset:0 auto 0 -38%;width:38%;border-radius:inherit;background:var(--pe-accent);animation:documentIndeterminate 1.35s ease-in-out infinite}
.processing-bytes{display:flex;justify-content:space-between;gap:12px;margin-top:6px;color:var(--muted);font-size:12px}
.processing-steps{display:grid;gap:9px;margin-top:18px}
.processing-step{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:center;color:var(--muted);font-size:13px;line-height:1.35}
.processing-step-icon{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:850}
.processing-step.done{color:var(--text)}.processing-step.done .processing-step-icon{border-color:rgba(33,94,79,.25);background:rgba(33,94,79,.09);color:var(--pe-accent)}
.processing-step.active{color:var(--text);font-weight:750}.processing-step.active .processing-step-icon{border-color:var(--pe-accent);box-shadow:inset 0 0 0 4px #fff;background:var(--pe-accent)}
.processing-queue{display:grid;gap:9px}
.processing-overall{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.processing-overall-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:9px}.processing-overall-head strong{font-size:15px}.processing-overall-head span{font-size:12px;color:var(--muted)}
.processing-queue-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.processing-queue-icon{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:12px;font-weight:850}
.processing-queue-item[data-state="completed"] .processing-queue-icon{background:rgba(33,94,79,.09);color:var(--pe-accent);border-color:rgba(33,94,79,.25)}
.processing-queue-item[data-state="failed"] .processing-queue-icon{background:#fff5f2;color:#a13b25;border-color:#efd2cb}
.processing-queue-main{min-width:0}.processing-queue-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.processing-queue-main span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.processing-queue-action{display:flex;gap:6px;align-items:center}
.processing-error{padding:14px 15px;border:1px solid #efd2cb;border-radius:12px;background:#fff8f6}.processing-error strong{display:block}.processing-error p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.processing-review-skeleton{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.processing-review-skeleton div{height:44px;border:1px solid var(--line);border-radius:10px;background:#f7f9f8;position:relative;overflow:hidden}.processing-review-skeleton div::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:documentShimmer 1.8s ease-in-out infinite}
@keyframes documentScan{0%,100%{transform:translateY(0);opacity:.18}50%{transform:translateY(155px);opacity:.48}}
@keyframes documentIndeterminate{0%{transform:translateX(0)}100%{transform:translateX(365%)}}
@keyframes documentShimmer{100%{transform:translateX(100%)}}

async function performCloudStateSync(requestedUserId){
 if(!currentUser||currentUser.id!==requestedUserId)return;
 if(!navigator.onLine){setCloudSyncStatus('offline');return}
 setCloudSyncStatus('saving');
 const sb=await getSupabase(),snapshot=structuredClone(state),expectedVersion=cloudVersion;
 let {data,error}=await sb.rpc('save_ledger_state',{p_expected_version:expectedVersion,p_state:snapshot});
 if(error)throw error;
 if(data==null){
  const {data:remote,error:remoteErr}=await sb.from('ledger_state').select('state,version').eq('user_id',requestedUserId).maybeSingle();
  if(remoteErr)throw remoteErr;
  if(!remote){
   const {error:insertErr}=await sb.from('ledger_state').insert({user_id:requestedUserId,state:snapshot,version:1});
   if(insertErr)throw insertErr;
   cloudVersion=1;setCloudSyncStatus('saved');return
  }
  setCloudSyncStatus('conflict');
  const conflictKey=conflictBackupKey();if(conflictKey)localStorage.setItem(conflictKey,JSON.stringify({savedAt:new Date().toISOString(),state:snapshot}));
  toast('Syncconflict: je lokale wijziging is veilig als herstelkopie bewaard.');
  state=normalizeState(remote.state||{});cloudVersion=Number(remote.version||1);localStorage.setItem(userDataKey(),JSON.stringify(state));render();return
 }
 cloudVersion=Number(data);setCloudSyncStatus('saved')
}

}

function dataHealthIssues(){

function mapAuthError(err,context='auth'){

 if(code.includes('email')&&code.includes('invalid')||/invalid email/.test(raw))return 'Vul een geldig e-mailadres in.';

 if(/already registered|user.*exists|already exists/.test(raw)||code.includes('user_already_exists'))return 'Er bestaat al een account met dit e-mailadres. Log in of kies ‘Wachtwoord vergeten?’.';
 if(/invalid login credentials|invalid credentials/.test(raw))return 'E-mailadres of wachtwoord is onjuist. Controleer je gegevens of kies ‘Wachtwoord vergeten?’.';
 if(/email not confirmed|email_not_confirmed/.test(raw)||code.includes('email_not_confirmed'))return 'Je e-mailadres is nog niet bevestigd. Controleer je e-mail of stuur een nieuwe bevestigingsmail.';
 if(/otp.*expired|token.*expired|expired.*token/.test(raw)||code.includes('otp_expired'))return context==='recovery'?'Deze herstel-link is verlopen. Vraag een nieuwe aan.':'Deze bevestigingslink is verlopen. Vraag een nieuwe link aan.';
 if(/email.*send|smtp|sending.*email/.test(raw)||code.includes('email_send'))return 'De e-mail kon niet worden verstuurd. Probeer het opnieuw.';
 if(/rate limit|too many|over_email_send_rate_limit/.test(raw)||code.includes('rate_limit'))return 'Je hebt dit te vaak geprobeerd. Wacht even en probeer daarna opnieuw.';
 if(/failed to fetch|network|load failed|offline/.test(raw))return 'Geen internetverbinding. Controleer je verbinding en probeer opnieuw.';

}

}

async function loginUser(e){
 e.preventDefault();const d=new FormData(e.currentTarget),email=String(d.get('email')||'').trim().toLowerCase(),pw=String(d.get('password')||'');
 try{
  const sb=await getSupabase();let {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error&&/invalid login credentials/i.test(error.message||'')){
   const legacyUser=legacyUserForEmail(email);
   if(legacyUser){
    const hash=await hashPassword(pw,legacyUser.salt);
    if(hash===legacyUser.passwordHash){
     const created=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:AUTH_REDIRECT_URL}});
     if(created.error)throw created.error;
     if(!created.data.session){setPendingVerificationEmail(email);showVerificationState(email);startVerificationCooldown(60);toast('Je oude account is omgezet. Bevestig je e-mailadres om verder te gaan.');return}
     data=created.data;error=null
    }
   }
  }
  if(error)throw error;if(!data?.user)throw new Error('Inloggen is mislukt.');
  if(await requireMfaForUser(data.user))return;
  try{await hydrateCloudAccount(data.user)}catch(err){throw Object.assign(new Error(mapAuthError(err,'hydration')),{code:'HYDRATION'})}
  enterApp()
 }catch(err){const context=String(err?.code||'')==='HYDRATION'?'hydration':'login';authError(mapAuthError(err,context));if(/email not confirmed/i.test(String(err?.message||''))){setPendingVerificationEmail(email);const el=document.getElementById('authError');if(el)el.insertAdjacentHTML('beforeend',' <button type="button" class="link-btn" onclick="showVerificationState(pendingVerificationEmail())">Bevestigingsmail opnieuw sturen</button>')}}
}

function toCents(v){const n=Number(v||0);return Math.round((n+(n>=0?Number.EPSILON:-Number.EPSILON))*100)}
function fromCents(c){return Number(c||0)/100}
function roundMoney(v){return fromCents(toCents(v))}
function lineNetAmount(l){return roundMoney(Number(l?.qty||0)*Number(l?.unit||0))}
function invoiceDiscountBase(i){return roundMoney((i?.lines||[]).reduce((s,l)=>roundMoney(s+lineNetAmount(l)),0))}
function invoiceDiscountAmount(i){const base=Math.max(0,invoiceDiscountBase(i)),type=String(i?.discountType||'none'),value=Math.max(0,Number(i?.discountValue||0));if(type==='percent')return roundMoney(Math.min(base,base*Math.min(100,value)/100));if(type==='fixed')return roundMoney(Math.min(base,value));return 0}
function allocateDiscountCents(amounts,discountCents){
 const total=amounts.reduce((sum,value)=>sum+value,0),discount=Math.min(Math.max(0,discountCents),Math.max(0,total));
 if(!discount||total<=0)return amounts.slice();
 const target=total-discount,parts=amounts.map((value,index)=>{const scaled=value*target/total;return {index,cents:Math.floor(scaled),remainder:scaled-Math.floor(scaled)}});
 let remainder=target-parts.reduce((sum,part)=>sum+part.cents,0);
 const order=parts.slice().sort((a,b)=>b.remainder-a.remainder||a.index-b.index);
 for(let index=0;index<remainder;index++)order[index%order.length].cents++;
 return parts.map(part=>part.cents);
}
function invoiceDiscountFactor(i){const base=invoiceDiscountBase(i);return base>0?(base-invoiceDiscountAmount(i))/base:1}
function discountedLineNet(i,l){const lines=i?.lines||[],index=lines.indexOf(l);if(index<0)return roundMoney(lineNetAmount(l)*invoiceDiscountFactor(i));return fromCents(allocateDiscountCents(lines.map(line=>toCents(lineNetAmount(line))),toCents(invoiceDiscountAmount(i)))[index])}
function discountedLineVat(i,l){return roundMoney(discountedLineNet(i,l)*Number(l?.vat||0)/100)}
function lineVatAmount(l){return roundMoney(lineNetAmount(l)*Number(l?.vat||0)/100)}
function invoiceSign(i){return i?.kind==='credit'?-1:1}
function invoiceTaxTreatment(i){return String(i?.taxTreatment||'standard')}
function isZeroOutputVatTreatment(v){return ['kor','reverse','icp','exempt'].includes(String(v||'standard'))}
function invoiceNet(i){const raw=i?.importedTotals?.net!=null?Math.abs(roundMoney(i.importedTotals.net)):(i?.lines||[]).reduce((s,l)=>roundMoney(s+discountedLineNet(i,l)),0);return roundMoney(raw*invoiceSign(i))}
function invoiceVat(i){if(isZeroOutputVatTreatment(invoiceTaxTreatment(i)))return 0;const raw=i?.importedTotals?.vat!=null?Math.abs(roundMoney(i.importedTotals.vat)):(i?.lines||[]).reduce((s,l)=>roundMoney(s+discountedLineVat(i,l)),0);return roundMoney(raw*invoiceSign(i))}
function invoiceGross(i){if(i?.importedTotals?.gross!=null)return roundMoney(Math.abs(roundMoney(i.importedTotals.gross))*invoiceSign(i));return roundMoney(invoiceNet(i)+invoiceVat(i))}
function invoicePayments(i){return Array.isArray(i?.payments)?i.payments:[]}
function invoicePaidAmount(i){const manual=invoicePayments(i).reduce((s,p)=>roundMoney(s+Math.abs(roundMoney(p.amount||0))),0),bank=state.transactions.filter(t=>t.status==='matched'&&t.matchType==='invoice'&&t.matchId===i.id).reduce((s,t)=>roundMoney(s+Math.abs(roundMoney(t.amount||0))),0);if(!manual&&!bank&&i?.selfBilling&&i?.status==='paid'&&Number(i.payout||0)>0)return Math.abs(invoiceGross(i));return roundMoney(manual+bank)}
function invoiceOutstanding(i){return Math.max(0,roundMoney(Math.abs(invoiceGross(i))-invoicePaidAmount(i)))}
function syncInvoiceStatus(i){if(!i||i.status==='draft')return;if(invoiceOutstanding(i)<=0.02){i.status='paid';if(!i.paidDate)i.paidDate=today()}else{if(i.status==='paid')i.status='sent';delete i.paidDate}}
function expenseTaxTreatment(e){return String(e?.taxTreatment||'standard')}
function expenseVatRates(e){return [...new Set((Array.isArray(e?.vatLines)?e.vatLines:[]).map(v=>Number(v?.rate)).filter(Number.isFinite))].sort((a,b)=>a-b)}
function expenseHasMixedVat(e){return !!e?.mixedRates||expenseVatRates(e).length>1}
function normalizeExpenseVatSemantics(e){
 if(!e||typeof e!=='object')return e;
 const out={...e},rates=expenseVatRates(out);
 if(!!out.mixedRates||rates.length>1){out.mixedRates=true;out.vatRate=null}
 else if(rates.length===1){out.mixedRates=false;if(out.vatRate==null||out.vatRate==='')out.vatRate=rates[0]}
 return out
}
function expenseVatRateValue(e){
 if(expenseHasMixedVat(e))return null;
 if(e?.vatRate!==''&&e?.vatRate!=null&&Number.isFinite(Number(e.vatRate)))return Number(e.vatRate);
 const rates=expenseVatRates(e);return rates.length===1?rates[0]:null
}
function expenseVatRateLabel(e){if(expenseHasMixedVat(e))return 'Gemengd';const r=expenseVatRateValue(e);return r==null?'—':num(r)+'%'}
function expenseVatRateExport(e){if(expenseHasMixedVat(e))return 'Gemengd';const r=expenseVatRateValue(e);return r==null?'':String(r)}
function expenseVatBreakdownLabel(e){const lines=canonicalFinancialVatLines(e?.vatLines);return lines.map(v=>`${num(v.rate)}%: ${money(v.taxableAmount)} grondslag / ${money(v.vatAmount)} btw`).join(' · ')}
function expenseVat(e){
 if(expenseTaxTreatment(e)==='kor'||expenseTaxTreatment(e)==='exempt')return 0;
 if(e?.vatAmount!=null)return roundMoney(e.vatAmount);
 const lines=Array.isArray(e?.vatLines)?e.vatLines:[],rates=[...new Set(lines.map(v=>Number(v?.rate)).filter(Number.isFinite))],mixed=!!e?.mixedRates||rates.length>1;
 if(mixed&&lines.length){const amounts=lines.map(v=>Number(v?.vatAmount));if(amounts.every(Number.isFinite))return roundMoney(amounts.reduce((sum,v)=>sum+v,0))}
 const scalar=e?.vatRate!==''&&e?.vatRate!=null&&Number.isFinite(Number(e.vatRate))?Number(e.vatRate):(rates.length===1?rates[0]:0);
 return roundMoney(Number(e?.exVat||0)*scalar/100)
}
function expenseGross(e){return e?.gross!=null?roundMoney(e.gross):roundMoney(Number(e?.exVat||0)+expenseVat(e))}

function listNormalize(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ')}
function listAmountText(v){
  const n=Number(v);if(!Number.isFinite(n))return '';
  const compact=String(Math.round(n*100)/100),fixed=n.toFixed(2);
  return [compact,fixed,fixed.replace('.',','),money(n)].join(' ')
}
function listPeriodMatch(dateValue,period='all',from='',to=''){
  const d=String(dateValue||'').slice(0,10);if(!d||period==='all')return period==='all';
  if(period==='custom')return (!from||d>=from)&&(!to||d<=to);
  const now=new Date(),year=String(now.getFullYear()),month=String(now.getMonth()+1).padStart(2,'0');
  if(period==='year')return d.startsWith(year+'-');
  if(period==='month')return d.startsWith(year+'-'+month);
  if(period==='quarter'){const m=Number(d.slice(5,7)),q=Math.floor(now.getMonth()/3)+1;return d.startsWith(year+'-')&&Math.floor((m-1)/3)+1===q}
  return true
}

  }

function expenseListType(e){
  const t=String(e?.documentType||'').toLowerCase(),src=String(e?.source||'').toLowerCase();
  if(t==='receipt'||src.includes('receipt'))return 'receipt';
  if(t.includes('invoice')||src.includes('document-import'))return 'invoice';

function documentListStatus(d){

function listSearchHaystack(name,item){

    const c=getContact(item.customerId);return [item.number,c.name,item.paymentReference,listAmountText(invoiceGross(item)),listAmountText(invoiceNet(item))].join(' ')
  }
  if(name==='expenses')return [item.vendor,item.invoiceNumber,item.notes,item.category,listAmountText(item.exVat),listAmountText(expenseGross(item))].join(' ');
  if(name==='bank')return [item.description,listAmountText(item.amount),listTransactionLinkText(item)].join(' ');
  if(name==='contacts')return [item.name,item.contactPerson,item.email,item.city,item.vat].join(' ');

function invoiceListStatusMatch(i,status){
  if(status==='all')return true;
  if(status==='draft')return i.status==='draft';
  if(status==='overdue')return invoiceEffectiveStatus(i)==='overdue';
  if(status==='paid')return i.status!=='draft'&&invoiceEffectiveStatus(i)==='paid';
  if(status==='open')return i.status!=='draft'&&invoiceOutstanding(i)>.02;
  return true
}
function listMatchesFilters(name,item){
  const f=listPageState(name).filters||{};
  if(name==='invoices'){
    if(!invoiceListStatusMatch(item,f.status))return false;
    if(f.customer!=='all'&&item.customerId!==f.customer)return false;
    if(!listPeriodMatch(item.issueDate,f.period))return false;
    if(f.type==='invoice'&&item.kind==='credit')return false;
    if(f.type==='credit'&&item.kind!=='credit')return false;
    return true
  }
  if(name==='expenses'){
    if(f.vendor!=='all'&&String(item.vendor||'')!==f.vendor)return false;
    if(!listPeriodMatch(item.date,f.period))return false;
    if(f.category!=='all'&&String(item.category||'')!==f.category)return false;
    if(f.docType!=='all'&&expenseListType(item)!==f.docType)return false;
    return true
  }
  if(name==='bank'){
    if(f.status==='unmatched'&&item.status!=='unmatched')return false;
    if(f.status==='matched'&&item.status!=='matched')return false;
    if(f.direction==='income'&&Number(item.amount||0)<=0)return false;
    if(f.direction==='expense'&&Number(item.amount||0)>=0)return false;
    if(!listPeriodMatch(item.date,f.period))return false;
    return true
  }
  if(name==='contacts')return f.type==='all'||item.type===f.type;
  if(name==='services')return f.status==='all'||(f.status==='active'?item.active!==false:item.active===false);
  if(name==='documents'){
    if(f.linked==='linked'&&!item.linkedId)return false;
    if(f.linked==='unlinked'&&item.linkedId)return false;
    if(f.type!=='all'&&String(item.type||'')!==f.type)return false;
    if(f.status!=='all'&&documentListStatus(item)!==f.status)return false;
    if(!listPeriodMatch(item.date,f.period))return false;
    return true
  }
  if(name==='bookings'){
    if(f.status!=='all'&&item.status!==f.status)return false;
    const upcoming=String(item.date||'')>=today();
    if(f.time==='upcoming'&&!upcoming)return false;
    if(f.time==='past'&&upcoming)return false;
    if(!listPeriodMatch(item.date,f.period,f.from,f.to))return false;
    return true
  }
  return true
}
function listSortCompare(name,a,b){
  const sort=listPageState(name).sort||LIST_DEFAULTS[name]?.sort||'';
  const text=(x,y)=>String(x||'').localeCompare(String(y||''),'nl',{sensitivity:'base'});
  if(name==='invoices'){
    if(sort==='issue-asc')return text(a.issueDate,b.issueDate);
    if(sort==='due-asc')return text(a.dueDate,b.dueDate);
    if(sort==='amount-desc')return invoiceGross(b)-invoiceGross(a);
    if(sort==='amount-asc')return invoiceGross(a)-invoiceGross(b);
    if(sort==='customer-asc')return text(getContact(a.customerId).name,getContact(b.customerId).name);
    if(sort==='customer-desc')return text(getContact(b.customerId).name,getContact(a.customerId).name);
    return text(b.issueDate,a.issueDate)
  }
  if(name==='expenses'){
    if(sort==='date-asc')return text(a.date,b.date);
    if(sort==='vendor-asc')return text(a.vendor,b.vendor);
    if(sort==='vendor-desc')return text(b.vendor,a.vendor);
    if(sort==='amount-desc')return expenseGross(b)-expenseGross(a);
    if(sort==='amount-asc')return expenseGross(a)-expenseGross(b);
    return text(b.date,a.date)
  }
  if(name==='bank'){
    if(sort==='date-asc')return text(a.date,b.date);
    if(sort==='amount-desc')return Number(b.amount||0)-Number(a.amount||0);
    if(sort==='amount-asc')return Number(a.amount||0)-Number(b.amount||0);
    return text(b.date,a.date)
  }
  if(name==='contacts')return sort==='name-desc'?text(b.name,a.name):text(a.name,b.name);
  if(name==='services'){
    if(sort==='name-desc')return text(b.name,a.name);
    if(sort==='price-asc')return Number(a.price||0)-Number(b.price||0);
    if(sort==='price-desc')return Number(b.price||0)-Number(a.price||0);
    return text(a.name,b.name)
  }
  if(name==='documents'){
    if(sort==='date-asc')return text(a.date,b.date);
    if(sort==='name-asc')return text(a.name,b.name);
    if(sort==='name-desc')return text(b.name,a.name);
    return text(b.date,a.date)
  }
  if(name==='bookings'){
    const av=String(a.date||'')+'T'+String(a.time||'00:00'),bv=String(b.date||'')+'T'+String(b.time||'00:00');
    if(sort==='newest')return text(bv,av);
    if(sort==='oldest')return text(av,bv);
    if(sort==='customer-asc')return text(getContact(a.customerId).name,getContact(b.customerId).name);
    const now=new Date(),ad=new Date(av),bd=new Date(bv),af=ad>=now,bf=bd>=now;
    if(af!==bf)return af?-1:1;
    return af?ad-bd:bd-ad
  }
  return 0
}
function listSource(name){

    invoices:state.invoices,expenses:state.expenses,bank:state.transactions,contacts:state.contacts,
    services:state.services,documents:state.documents,bookings:state.bookings
  })[name]||[]

function getListRows(name){
  const s=listPageState(name),q=listNormalize(s.query);

  if(q)rows=rows.filter(item=>listNormalize(listSearchHaystack(name,item)).includes(q));

}

function documentDeleteEligibility(d){
 if(!d)return {allowed:false,reason:'Document niet gevonden.'};
 if(d.linkedId)return {allowed:false,reason:'Dit document is gekoppeld aan een definitieve boeking of factuur en kan hier niet veilig worden verwijderd.'};
 const ref=String(d.fileId||''),job=documentProcessingJobs.find(j=>String(j.client_ref||'')===ref),jobState=String(job?.state||d.processingState||'');
 if(['received','queued','processing','validating'].includes(jobState))return {allowed:false,reason:'Wacht tot de verwerking klaar is voordat je dit document verwijdert.'};
 const local=(documentProcessingSession?.items||[]).find(item=>String(item.clientRef||'')===ref);
 if(local&&['selected','uploading','uploaded','queued','processing','validating'].includes(String(local.state||'')))return {allowed:false,reason:'Dit document wordt nog verwerkt.'};
 return {allowed:true,reason:''}
}
function documentDeleteActionHtml(d){

}

function requestDocumentDelete(id){
 const d=state.documents.find(x=>x.id===id);if(!d)return;
 const check=documentDeleteEligibility(d);if(!check.allowed)return toast(check.reason);
 if(confirm('Document verwijderen?'))void deleteDocumentNow(id)
}
async function deleteDocumentNow(id){
 const d=state.documents.find(x=>x.id===id);if(!d)return false;
 const check=documentDeleteEligibility(d);if(!check.allowed){toast(check.reason);return false}
 const ref=String(d.fileId||'');
 if(!TEST_MODE_NO_AUTH&&ref){
  try{
   const sb=await getSupabase(),{data,error}=await sb.from('document_processing_jobs').select('state').eq('user_id',currentUser.id).eq('client_ref',ref).maybeSingle();
   if(error)throw error;
   if(data&&!persistentDocumentIsTerminal(data)){toast('Wacht tot de verwerking klaar is voordat je dit document verwijdert.');return false}
  }catch(e){console.warn(e);toast('Documentstatus kon niet veilig worden gecontroleerd. Probeer opnieuw.');return false}
 }
 if(ref&&!(await deleteStoredFile(ref))){toast('Document kon niet worden verwijderd. Probeer opnieuw.');return false}
 state.documents=state.documents.filter(x=>x.id!==id);
 documentProcessingJobs=documentProcessingJobs.filter(j=>String(j.client_ref||'')!==ref);
 if(documentProcessingSession?.items)documentProcessingSession.items=documentProcessingSession.items.filter(item=>String(item.clientRef||'')!==ref);
 save();renderGlobalDocumentIndicator();render();toast('Document verwijderd');return true
}
function removePersistentDocumentByJob(jobId){

 const d=state.documents.find(x=>String(x.fileId||'')===String(job.client_ref||''));
 if(!d)return toast('Document niet gevonden.');
 requestDocumentDelete(d.id)
}

let appControlId=0;
function enhanceAppInterface(root){
 if(!root)return;
 root.querySelectorAll('.table,.invoice-paper table').forEach(table=>{
  if(!table.querySelector('thead th'))return;

  const wrapper=table.closest('.table-wrap');wrapper?.classList.add('mobile-stack-wrap');
  const tableId=table.id||('app-table-'+(++appControlId));table.id=tableId;
  const headers=[...table.querySelectorAll('thead th')];headers.forEach((th,index)=>{if(!th.textContent.trim())th.textContent='Acties';th.scope='col';if(!th.id)th.id=tableId+'-col-'+index});
  table.querySelectorAll('tbody tr').forEach(row=>[...row.children].forEach((cell,index)=>{
   if(cell.tagName!=='TD'||cell.hasAttribute('colspan')||!headers[index])return;
   cell.setAttribute('headers',headers[index].id);
   if(table.classList.contains('mobile-labelled')&&!cell.querySelector('.mobile-cell-value')){
    const value=document.createElement('span');value.className='mobile-cell-value';while(cell.firstChild)value.appendChild(cell.firstChild);
    const label=document.createElement('span');label.className='mobile-cell-label';label.setAttribute('aria-hidden','true');label.textContent=headers[index].textContent.trim();cell.append(label,value)
   }
  }))
 });
 root.querySelectorAll('.field,.auth-field').forEach(field=>{
  const label=field.querySelector('label'),input=field.querySelector('input:not([type="hidden"]),select,textarea');

 });
 root.querySelectorAll('.metric,.mini-kpi').forEach(metric=>{const length=metric.querySelector('.metric-value,strong')?.textContent.trim().length||0;metric.classList.toggle('metric-wide',length>11);metric.classList.toggle('metric-huge',length>14)});

}
let dashboardChartController=null;
function wireDashboardChart(){
 dashboardChartController?.abort();dashboardChartController=null;
 const cards=[...document.querySelectorAll('.dashboard-chart-card,.report-result-card')].filter(card=>card.querySelector('[data-chart-values]')&&card.querySelector('.chart-values'));if(!cards.length)return;
 const controller=new AbortController();dashboardChartController=controller;const options={signal:controller.signal},states=[];
 for(const card of cards){
  const buttons=[...card.querySelectorAll('[data-chart-values]')],output=card.querySelector('.chart-values'),chart=card.querySelector('.chart');let selected=null,pinned=false;
  const close=()=>{output.hidden=true;selected=null;pinned=false;buttons.forEach(button=>button.setAttribute('aria-pressed','false'))};
  const position=()=>{
   if(!selected||output.hidden)return;
   const bounds=card.getBoundingClientRect(),bars=[...selected.querySelectorAll('.bar')].map(el=>el.getBoundingClientRect()),anchor=selected.getBoundingClientRect(),tip=output.getBoundingClientRect(),topbar=document.querySelector('.topbar')?.getBoundingClientRect();
   const minX=Math.max(bounds.left+8,8),maxX=Math.min(bounds.right-8,window.innerWidth-8)-tip.width;
   const left=Math.max(minX,Math.min(maxX,anchor.left+anchor.width/2-tip.width/2));
   const minY=Math.max(bounds.top+8,(card.querySelector('.section-head')?.getBoundingClientRect().bottom||bounds.top)+8,(topbar?.bottom||0)+8),maxY=Math.min(bounds.bottom-8,window.innerHeight-8)-tip.height;
   const top=Math.max(minY,Math.min(maxY,Math.min(...bars.map(bar=>bar.top))-tip.height-8));
   output.style.left=(left-bounds.left)+'px';output.style.top=(top-bounds.top)+'px';
  };
  const show=button=>{
   selected=button;const values=JSON.parse(button.dataset.chartValues);output.replaceChildren();
   const period=document.createElement('strong');period.className='chart-tooltip-period';period.textContent=values.month;
   output.append(period);for(const [label,value] of [['Omzet',values.sales],['Kosten',values.costs],['Winst',values.profit]]){const row=document.createElement('span'),name=document.createElement('span'),amount=document.createElement('strong');name.textContent=label;amount.textContent=value;row.append(name,amount);output.append(row)}
   output.hidden=false;buttons.forEach(el=>el.setAttribute('aria-pressed',String(el===button)));position();
  };
  buttons.forEach(button=>{
   button.addEventListener('focus',()=>show(button),options);
   button.addEventListener('pointerenter',event=>{if(event.pointerType!=='touch'&&!pinned)show(button)},options);
   button.addEventListener('pointerleave',()=>{if(!pinned&&document.activeElement!==button)close()},options);
   button.addEventListener('blur',()=>{if(!pinned)close()},options);
   button.addEventListener('click',()=>{if(pinned&&selected===button){close();return}pinned=true;show(button)},options);
  });
  states.push({card,chart,output,close,position});
  window.addEventListener('resize',position,options);window.addEventListener('scroll',position,{...options,capture:true});
 }
 document.addEventListener('pointerdown',event=>states.forEach(state=>{if(!state.chart.contains(event.target))state.close()}),options);
 document.addEventListener('focusin',event=>states.forEach(state=>{if(!state.chart.contains(event.target))state.close()}),options);
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&states.some(state=>!state.output.hidden)){event.preventDefault();states.forEach(state=>state.close())}},options);
}

function savePayment(id){const i=state.invoices.find(x=>x.id===id),f=document.getElementById('paymentForm');if(!i||!f?.reportValidity())return;const d=new FormData(f),amount=roundMoney(d.get('amount')||0),date=String(d.get('date')||''),out=invoiceOutstanding(i);if(amount<=0||amount>out+.02)return toast('Controleer het betalingsbedrag');const bankDuplicate=state.transactions.find(t=>t.status==='matched'&&t.matchType==='invoice'&&t.matchId===i.id&&t.date===date&&Math.abs(Math.abs(roundMoney(t.amount||0))-Math.abs(amount))<=0.02);if(bankDuplicate)return toast('Deze betaling staat al als gekoppelde banktransactie geregistreerd en wordt niet dubbel geboekt.');if(!Array.isArray(i.payments))i.payments=[];i.payments.push({id:uid('p'),date,amount,note:String(d.get('note')||'')});syncInvoiceStatus(i);logEvent('Betaling geregistreerd',`${i.number} · ${money(amount)}`,'invoice',i.id);save();closeModal();render();toast(invoiceOutstanding(i)<=.02?'Factuur volledig betaald':'Deelbetaling geregistreerd')}

function creditedQtyForLine(src,index){return roundMoney(state.invoices.filter(c=>c.kind==='credit'&&c.creditFor===src.id&&c.status!=='cancelled').reduce((sum,c)=>{const exact=(c.lines||[]).filter(l=>Number(l.sourceLineIndex)===Number(index)).reduce((s,l)=>s+Number(l.qty||0),0);if(exact)return sum+exact;const sl=src.lines[index];const legacy=(c.lines||[]).filter(l=>l.sourceLineIndex==null&&String(l.desc||'')===String(sl?.desc||'')&&roundMoney(l.unit||0)===roundMoney(sl?.unit||0)&&Number(l.vat||0)===Number(sl?.vat||0)).reduce((s,l)=>s+Number(l.qty||0),0);return sum+legacy},0))}
function createCreditNote(id){const src=state.invoices.find(x=>x.id===id);if(!src)return;if(src.kind==='credit'||src.status==='draft')return toast('Maak een creditnota alleen op een definitieve originele factuur.');const rows=(src.lines||[]).map((l,idx)=>{const used=creditedQtyForLine(src,idx),remaining=Math.max(0,roundMoney(Number(l.qty||0)-used));return `<div class="line-item credit-line" data-index="${idx}" style="grid-template-columns:minmax(190px,1.6fr) 90px 110px 90px"><div class="field"><label>Omschrijving</label><input value="${esc(l.desc||'')}" readonly></div><div class="field"><label>Credit aantal</label><input data-credit-qty type="number" min="0" max="${remaining}" step="0.01" value="${remaining}"></div><div class="field"><label>Prijs excl.</label><input value="${Number(l.unit||0).toFixed(2)}" readonly></div><div class="field"><label>Resterend</label><input value="${remaining}" readonly></div></div>`}).join('');modal(`Creditnota voor ${esc(src.number)}`,`<div class="notice info" style="margin-bottom:14px"><strong>Volledig of gedeeltelijk crediteren.</strong> Zet bij regels die je niet wilt crediteren het aantal op 0. Boekuna blokkeert overcreditering.</div><div id="creditLines">${rows}</div><div class="field" style="margin-top:14px"><label>Reden / notitie</label><textarea id="creditReason">Credit op ${esc(src.number)}</textarea></div>`,`<button class="btn" onclick="closeModal()">Annuleren</button><button class="btn primary" onclick="saveCreditDraft('${src.id}')">Creditconcept maken</button>`,true)}
function saveCreditDraft(sourceId){try{const src=state.invoices.find(x=>x.id===sourceId);if(!src)return;const lines=[...document.querySelectorAll('#creditLines .credit-line')].map(row=>{const idx=Number(row.dataset.index),base=src.lines[idx],qty=roundMoney(row.querySelector('[data-credit-qty]').value||0),remaining=Math.max(0,roundMoney(Number(base.qty||0)-creditedQtyForLine(src,idx)));if(qty<0||qty>remaining+.001)throw new Error(`Credit aantal voor ${base.desc} is hoger dan resterend.`);return qty>0?{...structuredClone(base),qty,sourceLineIndex:idx}:null}).filter(Boolean);if(!lines.length)return toast('Vul minimaal één te crediteren aantal in.');const credit={id:uid('i'),number:conceptNumber('credit'),numberManaged:true,numberFinalized:false,kind:'credit',creditFor:src.id,customerId:src.customerId,issueDate:today(),supplyDate:today(),dueDate:today(),status:'draft',paidDate:null,payments:[],taxTreatment:src.taxTreatment||'standard',reference:`Credit op ${src.number}`,paymentReference:'',notes:String(document.getElementById('creditReason')?.value||`Creditfactuur voor ${src.number}`),lines};const check=validateCreditLimit(credit);if(!check.ok)return toast(check.message);state.invoices.unshift(credit);logEvent('Creditconcept aangemaakt',`${credit.number} voor ${src.number} · ${money(Math.abs(invoiceGross(credit)))}`,'invoice',credit.id);save();closeModal();navigate('invoices');toast('Gedeeltelijke/volledige creditnota als concept aangemaakt')}catch(err){toast(err?.message||'Creditnota kon niet worden aangemaakt')}}

function formatDocumentBytes(value){
 const n=Math.max(0,Number(value||0));if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(n<10240?1:0)+' KB';return (n/(1024*1024)).toFixed(n<10*1024*1024?1:0)+' MB'
}
function documentProcessingStepState(item,key){
 const terminal=['ready','review_required','completed'].includes(item.state);
 if(key==='upload')return item.uploaded?'done':item.state==='uploading'?'active':'pending';
 if(key==='read')return terminal||['validating','preparing_review'].includes(item.state)||item.processorComplete?'done':item.uploaded&&['queued','processing'].includes(item.state)?'active':'pending';
 if(key==='validate')return terminal?'done':['validating','preparing_review'].includes(item.state)?'active':'pending';
 if(key==='review')return ['ready','completed'].includes(item.state)?'done':item.state==='review_required'||item.state==='preparing_review'?'active':'pending';
 return 'pending'
}
function documentProcessingStatus(item){
 if(item.state==='failed')return 'Kon niet verwerkt worden';
 if(item.state==='selected')return 'Wacht';
 if(item.state==='uploading')return 'Uploaden…';
 if(item.state==='uploaded'||item.state==='queued')return 'Wacht';
 if(item.state==='processing')return item.message||'Wordt verwerkt…';
 if(item.state==='validating')return 'Bedragen controleren…';
 if(item.state==='preparing_review')return 'Je controle wordt voorbereid…';
 if(item.state==='ready')return 'Klaar';
 if(item.state==='review_required')return 'Controle nodig';
 if(item.state==='completed')return item.result?'Klaar voor controle':'Klaar';

function documentProcessingSubtext(item){

 if(item.longWait)return 'Dit document vraagt iets meer controle. Boekuna is nog bezig. De upload is afgerond; je kunt ondertussen verder werken.';
 if(item.state==='uploading')return 'Alleen de echte bestandsoverdracht krijgt een percentage.';
 if(item.state==='uploaded'||item.state==='queued')return 'Bestand ontvangen. Verwerking gaat op de achtergrond verder.';
 if(item.state==='processing')return item.subtext||'Document lezen en gegevens herkennen.';
 if(item.state==='validating')return 'Bedragen en btw worden gecontroleerd.';
 if(item.state==='preparing_review')return item.subtext||'Bij twijfel laten we het straks aan jou zien.';

 if(item.state==='completed')return item.result?'De verwerking is klaar. Controleer de herkende gegevens voordat je opslaat.':'Het document is verwerkt en opgeslagen.';

async function documentProcessorXhrOnce(fd,item,forceRefresh=false){
 const headers=await apiAuthHeaders({},forceRefresh);
 return await new Promise(function(resolve,reject){
  const xhr=new XMLHttpRequest();let uploadFinished=false;
  xhr.open('POST',DOCUMENT_PROCESSOR_URL+'/analyze',true);xhr.timeout=DOCUMENT_PROCESSING_TIMEOUT_MS;
  Object.entries(headers).forEach(function(entry){xhr.setRequestHeader(entry[0],String(entry[1]))});
  if(item){item.transferActive=true;activeDocumentTransfers++;item.uploadAttempt=Number(item.uploadAttempt||0)+1;documentProcessingTransition(item,'uploading');item.uploaded=false;item.uploadPercent=0;item.uploadLoaded=0;item.uploadTotal=Number(item.file?.size||0);setDocumentProcessingMessage(item,item.uploadAttempt>1?'Upload opnieuw starten…':'Bestand uploaden…',item.uploadAttempt>1?'Je sessie is vernieuwd; de bestandsoverdracht wordt opnieuw gestart.':'De bestandsoverdracht is gestart.')}
  const finishUpload=function(){
   if(uploadFinished)return;uploadFinished=true;
   if(item){finishActiveTransfer(item);item.uploaded=true;item.uploadLoaded=item.uploadTotal;item.uploadPercent=100;if(item.state==='uploading')documentProcessingTransition(item,'processing');setDocumentProcessingMessage(item,'Document wordt gelezen…','We halen de gegevens uit het document die nodig zijn voor je administratie.');startDocumentLongWait(item)}
  };
  xhr.upload.onprogress=function(e){
   if(!item)return;
   if(e.lengthComputable&&e.total>0){const pct=Math.max(Number(item.uploadPercent||0),Math.min(100,Math.round(e.loaded/e.total*100)));item.uploadPercent=pct;item.uploadLoaded=Math.max(Number(item.uploadLoaded||0),Number(e.loaded||0));item.uploadTotal=Number(e.total||item.uploadTotal||0)}
   else{item.uploadPercent=null;item.uploadLoaded=Math.max(Number(item.uploadLoaded||0),Number(e.loaded||0))}
   if(e.lengthComputable&&e.total>0)updateDocumentUploadProgressDom(item);else scheduleDocumentProcessingRender()
  };
  xhr.upload.onload=finishUpload;
  xhr.onload=function(){finishUpload();resolve({status:xhr.status,ok:xhr.status>=200&&xhr.status<300,json:async function(){try{return JSON.parse(xhr.responseText||'{}')}catch{return {}}}})};
  xhr.onerror=function(){finishActiveTransfer(item);reject(createUploadError('NETWORK_ERROR','',0,{category:'temporary',retryable:true,state:item?.uploaded?'no_changes':'not_saved'}))};
  xhr.ontimeout=function(){finishActiveTransfer(item);reject(createUploadError('PROCESSING_TIMEOUT','',504,{category:'temporary',retryable:true,state:'no_changes'}))};
  xhr.onabort=function(){finishActiveTransfer(item);reject(createUploadError('PROCESSING_TIMEOUT','',504,{category:'temporary',retryable:true,state:'no_changes'}))};
  xhr.send(fd)
 })
}
async function documentProcessorXhr(fd,item){

 return res

async function processDocumentQueueItem(item,smart=false){
 item.startedAt=Date.now();item.error=null;item.longWait=false;item.processingPhase='read';item.processorComplete=false;item.uploaded=false;item.uploadPercent=0;
 try{
  let pending=null;
  if(smart){
   const structure=await extractDocumentServer(item.file,function(msg){setDocumentProcessingMessage(item,msg)},item);
   const dt=structure.analysis?.documentType||structure.documentTypeHint||'other';
   item.financial=['purchase_invoice','sales_invoice','credit_invoice','receipt'].includes(dt);
   if(item.financial){
    pendingUploadKind=item.kind='auto';pending=await processFinancialDocument(item.file,structure,{processingItem:item,openReview:false})
   }else{
    item.processorComplete=true;documentProcessingTransition(item,'preparing_review');
    setDocumentProcessingMessage(item,'Document opslaan…','De analyse is afgerond. Het originele bestand wordt veilig opgeslagen.');
    const fileId=uid('file'),docId=uid('d');
    try{await putStoredFile(fileId,item.file)}catch(err){console.warn(err);throw createUploadError('PROCESSOR_UNAVAILABLE','',503,{category:'temporary',retryable:true,state:'unknown_state'})}
    state.documents.unshift({id:docId,fileId:fileId,name:item.file.name,type:dt==='bank_document'?'Bankdocument':'Document',date:today(),size:item.file.size,source:'smart-upload',pageCount:structure.pageCount??null,ocrUsed:!!structure.ocrUsed,analyzed:true,analysisWarnings:structure.warnings||[]});
    logEvent('Document slim geüpload',item.file.name+' · '+dt,'document',docId);save();render()
   }
  }else{
   item.financial=true;pendingUploadKind=item.kind;pending=await processFinancialDocument(item.file,null,{processingItem:item,openReview:false})
  }
  item.result=pending;documentProcessingTransition(item,'completed');setDocumentProcessingMessage(item,pending?'Klaar voor controle':'Gereed',pending?'Controleer de herkende gegevens voordat je opslaat.':'Het document is verwerkt en opgeslagen.');return item
 }catch(err){
  console.error('Document processing failed',err);item.error=err;
  if(!['completed','failed'].includes(item.state))documentProcessingTransition(item,'failed');else scheduleDocumentProcessingRender();
  return item
 }finally{finishActiveTransfer(item)}
}
async function startDocumentProcessingQueue(files,kind='auto',options={}){

 if(documentProcessingSession)cleanupDocumentProcessingSession();
 documentProcessingSession={id:uid('batch'),items:list.map(function(file){const item=createDocumentProcessingItem(file,kind);item.sourceInputId=String(options.sourceInputId||'');return item}),smart:!!options.smart,reviewingItemId:null,startedAt:Date.now()};
 renderDocumentProcessingExperience();
 const work=[...documentProcessingSession.items];
 const worker=async function(){while(work.length){const item=work.shift();if(item)await processDocumentQueueItem(item,documentProcessingSession.smart)}};
 await Promise.all(Array.from({length:Math.min(DOCUMENT_PROCESSING_MAX_PARALLEL,list.length)},function(){return worker()}));

 if(s.items.length===1){const item=s.items[0];if(item.state==='completed'&&item.result){pendingPdfImport=item.result;item.result=null;item.reviewed=true;s.reviewingItemId=item.id;showPdfImportReview(pendingPdfImport.parsed)}}
}

const PERSISTENT_DOCUMENT_TERMINAL=new Set(['ready','review_required','failed']);

function persistentDocumentIsTerminal(job){return PERSISTENT_DOCUMENT_TERMINAL.has(String(job?.state||''))}

 if(job?.state!=='ready'||job.resolved_at)return false;
 const type=String(job?.result?.analysis?.documentType||'');
 if(!['purchase_invoice','sales_invoice','sale_invoice','credit_invoice','receipt','invoice'].includes(type))return false;

d></tr>'}</tbody></table><h2>Inkoop & kosten</h2><table class="tbl"><thead><tr><th>Datum</th><th>Leverancier</th><th>Categorie</th><th class="r">Excl.</th><th class="r">Btw</th><th class="r">Incl.</th></tr></thead><tbody>${exps.map(e=>`<tr><td>${dateNL(e.date)}</td><td>${esc(e.vendor)}</td><td>${esc(e.category)}</td><td class="r">${money(e.exVat)}</td><td class="r">${money(expenseVat(e))}</td><td class="r">${money(expenseGross(e))}</td></tr>`).join('')||'<tr><td colspan="6">Geen kosten</td></tr>'}</tbody></table><div class="footer">Gegenereerd op ${new Date().toLocaleString('nl-NL')}. Controleer de administratie vóór formele aangiften of jaarstukken.</div></body></html>`}

<script id="boekuna-native-email-share">
(function(){
  'use strict';

  var prepared=null,preparingInvoiceId=null,shareInFlight=false;

  function cleanHeader(value,max){
    return String(value==null?'':value).replace(/[\r\n]+/g,' ').trim().slice(0,max||240);
  }

  function sanitizeInvoiceShareFilenamePart(value,max){
    return String(value==null?'':value)
      .normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
      .replace(/\./g,'')
      .replace(/[^a-zA-Z0-9_-]+/g,'-')
      .replace(/^-+|-+$/g,'')
      .replace(/-+/g,'-')
      .slice(0,max||80);
  }

  function invoiceShareFilename(invoice,customer){
    var label=invoice&&invoice.kind==='credit'?'Creditnota':'Factuur';
    var number=sanitizeInvoiceShareFilenamePart(invoice&&invoice.number,80)||'zonder-nummer';
    var party=sanitizeInvoiceShareFilenamePart(customer&&customer.name,72);
    return [label,number,party].filter(Boolean).join('-')+'.pdf';
  }

  function isInvoiceShareEmail(value){
    var email=String(value==null?'':value).trim();
    return email.length<=240 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && !/[\r\n]/.test(email);
  }

  function invoiceShareSubject(invoice,customer){
    return cleanHeader(invoiceMailSubject(invoice,customer),240);
  }

  function invoiceShareBody(invoice,customer){
    return String(defaultInvoiceEmailMessage(invoice,customer)||'').replace(/\r\n?/g,'\n').trim().slice(0,12000);
  }

  function buildInvoiceMailto(to,subject,body){
    if(!isInvoiceShareEmail(to))throw new Error('Ongeldig e-mailadres.');
    return 'mailto:'+encodeURIComponent(String(to).trim())+
      '?subject='+encodeURIComponent(cleanHeader(subject,240))+
      '&body='+encodeURIComponent(String(body||'').replace(/\r\n?/g,'\n'));
  }

  function canNativeShareInvoiceFile(file){
    try{
      return !!(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]}));
    }catch(_err){
      return false;
    }
  }

  function invoiceShareLog(invoice,channel,confirmed){
    logEvent(
      confirmed?'Factuur verzending bevestigd':'Factuur deelactie gestart',
      String(invoice.number||'')+' · '+channel,
      'invoice',
      invoice.id
    );
    save();
  }

  async function fetchInvoiceSharePdf(invoice,customer){
    var response=await fetch(EDGE_BASE+'/send-invoice',{
      method:'POST',
      headers:await apiAuthHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({action:'render_pdf',company:state.company,customer:customer,invoice:invoice})
    });
    if(!response.ok){
      var error=await response.json().catch(function(){return {};});
      if(response.status===401)throw new Error('Je sessie is verlopen. Log opnieuw in en probeer opnieuw.');
      if(response.status===403)throw new Error('Je hebt geen toegang tot deze factuur.');
      if(response.status>=500)throw new Error('De factuur-PDF kon tijdelijk niet worden gemaakt. Probeer opnieuw.');
      throw new Error(error.error||'De definitieve factuur-PDF kon niet worden gemaakt.');
    }
    var buffer=await response.arrayBuffer();
    var bytes=new Uint8Array(buffer);
    if(bytes.length<5 || bytes[0]!==0x25 || bytes[1]!==0x50 || bytes[2]!==0x44 || bytes[3]!==0x46){
      throw new Error('De gegenereerde factuur is geen geldige PDF.');
    }
    return new File([buffer],invoiceShareFilename(invoice,customer),{type:'application/pdf'});
  }

  function downloadInvoiceShareFile(file){
    if(!file)return false;
    var url=URL.createObjectURL(file);
    try{
      var anchor=document.createElement('a');
      anchor.href=url;
      anchor.download=file.name;
      anchor.rel='noopener';
      anchor.style.display='none';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      return true;
    }finally{
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
    }
  }

  async function copyInvoiceShareValue(kind){
    if(!prepared)return;
    var value=kind==='subject'?prepared.subject:prepared.body;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(value);
      }else{
        var area=document.createElement('textarea');
        area.value=value;
        area.setAttribute('readonly','');
        area.style.position='fixed';
        area.style.opacity='0';
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
      toast(kind==='subject'?'Onderwerp gekopieerd':'Bericht gekopieerd');
    }catch(_err){
      toast('Kopiëren lukte niet. Selecteer de tekst handmatig in je e-mailapp.');
    }
  }

  function showInvoiceShareConfirmation(id,channel){
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice)return;
    modal(
      'Heb je de factuur verzonden?',
      '<div class="notice info"><strong>Boekuna kan niet zien of je in je e-mailapp op Verzenden hebt gedrukt.</strong><br>Bevestig dit alleen als je de factuur echt hebt verstuurd.</div>',
      '<button class="btn" onclick="invoiceShareNotSent()">Nee, nog niet</button>'+
      '<button class="btn primary" onclick="confirmInvoiceShareSent(\''+id+'\',\''+channel+'\')">Ja, markeer als verzonden</button>'
    );
  }

  function invoiceShareNotSent(){
    closeModal();
    toast('Factuur niet als verzonden gemarkeerd');
  }

  function confirmInvoiceShareSent(id,channel){
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice)return;
    var customer=getContact(invoice.customerId);
    var at=new Date().toISOString();
    var subject=prepared&&prepared.id===id?prepared.subject:invoiceShareSubject(invoice,customer);
    invoice.lastSentAt=at;
    invoice.lastSentTo=prepared&&prepared.id===id?prepared.to:String(customer.email||'').trim();
    invoice.lastShareChannel=channel;
    invoice.sendHistory=(invoice.sendHistory||[]).concat([{
      sentAt:at,
      to:invoice.lastSentTo,
      subject:subject,
      provider:'manual-email-app',
      channel:channel,
      confirmedByUser:true
    }]);
    invoiceShareLog(invoice,channel,true);
    closeModal();
    toast('Factuur gemarkeerd als verzonden.');
    render();
  }

  function showPreparedNativeShareModal(){
    if(!prepared)return;
    modal(
      'Factuur klaar om te delen',
      '<div class="notice info"><strong>'+esc(prepared.file.name)+'</strong><br>Kies je e-mailapp in het deelmenu. Boekuna krijgt geen toegang tot je mailbox.</div>'+
      '<div class="help" style="margin-top:12px">Je bepaalt zelf in je e-mailapp of en wanneer je de e-mail verzendt.</div>',
      '<button class="btn" onclick="closeModal()">Annuleren</button>'+
      '<button class="btn primary" onclick="sharePreparedInvoice(true)">Kies je e-mailapp</button>'
    );
  }

  function showInvoiceShareFallback(autoDownload){
    if(!prepared)return;
    var downloaded=autoDownload?downloadInvoiceShareFile(prepared.file):false;
    modal(
      'Factuur klaar om te versturen',
      '<div class="notice info"><strong>'+esc(prepared.file.name)+(downloaded?' is gedownload.':' is klaar om te downloaden.')+'</strong><br>'+
      'Open daarna je e-mailapp. Voeg de PDF handmatig als bijlage toe voordat je verzendt.</div>'+
      '<div class="help" style="margin-top:12px">Boekuna opent je eigen e-mailapp. Wij krijgen geen toegang tot je mailbox.</div>',
      '<button class="btn" onclick="copyInvoiceShareValue(\'body\')">Bericht kopiëren</button>'+
      '<button class="btn" onclick="copyInvoiceShareValue(\'subject\')">Onderwerp kopiëren</button>'+
      '<button class="btn" onclick="downloadPreparedInvoicePdf()">PDF opnieuw downloaden</button>'+
      '<button class="btn primary" onclick="openPreparedInvoiceMailApp()">Open e-mailapp</button>',
      true
    );
  }

  function downloadPreparedInvoicePdf(){
    if(prepared)downloadInvoiceShareFile(prepared.file);
  }

  function openPreparedInvoiceMailApp(){
    if(!prepared)return;
    invoiceShareLog(prepared.invoice,'mailto',false);
    window.location.href=buildInvoiceMailto(prepared.to,prepared.subject,prepared.body);
    setTimeout(function(){showInvoiceShareConfirmation(prepared.id,'mailto');},350);
  }

  async function sharePreparedInvoice(fromExplicitUserAction){
    if(!prepared||shareInFlight)return;
    if(!canNativeShareInvoiceFile(prepared.file)){
      showInvoiceShareFallback(true);
      return;
    }
    shareInFlight=true;
    try{
      await navigator.share({title:prepared.subject,text:prepared.body,files:[prepared.file]});
      invoiceShareLog(prepared.invoice,'native_share',false);
      showInvoiceShareConfirmation(prepared.id,'native_share');
    }catch(err){
      if(err&&err.name==='AbortError'){
        closeModal();
        toast('Delen geannuleerd');
        return;
      }
      if(err&&err.name==='NotAllowedError'){
        if(fromExplicitUserAction)showInvoiceShareFallback(true);
        else showPreparedNativeShareModal();
        return;
      }
      console.warn('Native invoice share failed',err&&err.name?err.name:'SHARE_FAILED');
      showInvoiceShareFallback(true);
    }finally{
      shareInFlight=false;
    }
  }

  function showInvoiceShareError(id,message){
    modal(
      'Factuur kon niet worden voorbereid',
      '<div class="notice warn"><strong>'+esc(message||'De factuur-PDF kon niet worden gemaakt.')+'</strong><br>Je factuur is niet als verzonden gemarkeerd.</div>',
      '<button class="btn" onclick="closeModal()">Sluiten</button>'+
      '<button class="btn primary" onclick="closeModal();openSendInvoice(\''+id+'\')">Opnieuw proberen</button>'
    );
  }

  async function openInvoiceEmailShare(id){
    if(preparingInvoiceId===id){toast('De factuur wordt al voorbereid…');return;}
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice)return;
    var customer=getContact(invoice.customerId);

    if(invoice.status==='draft' || (invoice.numberManaged&&!invoice.numberFinalized&&isManagedDraftNumber(invoice.number))){
      modal(
        'Maak de factuur eerst definitief',
        '<div class="notice warn"><strong>Alleen een definitieve factuur kan via je e-mailapp worden verstuurd.</strong><br>Controleer en finaliseer de factuur eerst.</div>',
        '<button class="btn" onclick="closeModal()">Sluiten</button>'
      );
      return;
    }

    var draft=Object.assign({},invoice,{customer:customer,paymentDays:invoice.paymentDays||0});
    var checks=invoiceSendChecks(draft,invoice.id);
    if(checks.errors.length){
      var emailMissing=checks.errors.some(function(item){return item.label==='Klant-e-mail';});
      var list=checks.errors.map(function(item){
        return '<div class="legal-item"><strong>'+esc(item.label)+'</strong><p>'+esc(item.msg)+'</p></div>';
      }).join('');
      var footer='<button class="btn" onclick="closeModal()">Sluiten</button>';
      if(emailMissing&&customer&&customer.id){
        footer+='<button class="btn primary" onclick="closeModal();editContact(\''+customer.id+'\')">Klantgegevens openen</button>';
      }
      modal(
        'Factuur nog niet klaar voor verzending',
        '<div class="notice warn"><strong>Deze factuur mist gegevens die voor verzending nodig zijn.</strong></div>'+
        '<div class="legal-list" style="margin-top:12px">'+list+'</div>',
        footer
      );
      return;
    }

    if(!isInvoiceShareEmail(customer.email)){
      var invalidFooter='<button class="btn" onclick="closeModal()">Sluiten</button>';
      if(customer&&customer.id){
        invalidFooter+='<button class="btn primary" onclick="closeModal();editContact(\''+customer.id+'\')">Klantgegevens openen</button>';
      }
      modal(
        'Controleer het e-mailadres',
        '<div class="notice warn"><strong>'+esc(customer.email||'Geen e-mailadres')+'</strong><br>Vul een geldig klant-e-mailadres in voordat je de e-mailapp opent.</div>',
        invalidFooter
      );
      return;
    }

    var subject=invoiceShareSubject(invoice,customer);
    var body=invoiceShareBody(invoice,customer);

    preparingInvoiceId=id;
    modal(
      'Factuur wordt voorbereid…',
      '<div class="notice info"><strong>We maken de definitieve PDF klaar.</strong><br>Daarna kies je zelf je e-mailapp.</div><div class="help" style="margin-top:12px">Boekuna krijgt geen toegang tot je mailbox.</div>',
      '<button class="btn primary" disabled>Even geduld…</button>'
    );
    try{
      var file=await fetchInvoiceSharePdf(invoice,customer);
      prepared={
        id:invoice.id,
